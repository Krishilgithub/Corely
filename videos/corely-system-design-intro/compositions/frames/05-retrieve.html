  <script>
    (function () {
      var $ = function (n) {
        return document.getElementById("05-retrieve-" + n);
      };
      var SVGNS = "http://www.w3.org/2000/svg";
      var tl = gsap.timeline({ paused: true });

      // ---------- build the dot field (seeded, fixed positions) ----------
      var seed = 5051;
      function rand() {
        seed |= 0;
        seed = (seed + 0x6d2b79f5) | 0;
        var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      }
      var W = 920, H = 440, COLS = 8, ROWS = 5;
      var QX = 460, QY = 220;
      var cw = W / COLS, ch = H / ROWS;
      var pts = [];
      for (var r = 0; r < ROWS; r++) {
        for (var c = 0; c < COLS; c++) {
          var x = (c + 0.5) * cw + (rand() - 0.5) * 56;
          var y = (r + 0.5) * ch + (rand() - 0.5) * 40;
          var dx = x - QX, dy = y - QY, d = Math.sqrt(dx * dx + dy * dy);
          if (d < 48) {
            // keep a clear ring around the query point
            var k = 48 / Math.max(d, 1);
            x = QX + dx * k;
            y = QY + dy * k;
            d = 48;
          }
          pts.push({ x: x, y: y, d: d, key: rand(), blocked: false });
        }
      }
      // about a third (13 of 40) are sources this user cannot read
      var byKey = pts.slice().sort(function (a, b) { return a.key - b.key; });
      for (var i = 0; i < 13; i++) byKey[i].blocked = true;
      // make sure the filter matters: the nearest two dots overall are blocked
      var byDist = pts.slice().sort(function (a, b) { return a.d - b.d; });
      if (!byDist[0].blocked || !byDist[2].blocked) {
        var unblock = byKey.slice(0, 13).filter(function (p) { return p !== byDist[0] && p !== byDist[2]; })
          .sort(function (a, b) { return b.d - a.d; });
        var ui = 0;
        [byDist[0], byDist[2]].forEach(function (p) {
          if (!p.blocked) { p.blocked = true; unblock[ui++].blocked = false; }
        });
      }
      var visible = byDist.filter(function (p) { return !p.blocked; });
      var top8 = visible.slice(0, 8);

      var dotsWrap = $("dots");
      var svg = $("svg");
      pts.forEach(function (p, idx) {
        var el = document.createElement("div");
        el.className = "fr05-dot";
        el.style.left = (p.x - 9).toFixed(1) + "px";
        el.style.top = (p.y - 9).toFixed(1) + "px";
        dotsWrap.appendChild(el);
        p.el = el;
        p.idx = idx;
      });
      // threshold ring around the eight nearest
      var ringR = Math.min(top8[7].d + 24, 214);
      var ring = document.createElementNS(SVGNS, "circle");
      ring.setAttribute("cx", QX);
      ring.setAttribute("cy", QY);
      ring.setAttribute("r", ringR.toFixed(1));
      ring.setAttribute("fill", "rgba(30,43,250,0.04)");
      ring.setAttribute("stroke", "rgba(30,43,250,0.35)");
      ring.setAttribute("stroke-width", "1.5");
      ring.setAttribute("stroke-dasharray", "6 8");
      svg.appendChild(ring);
      // hairline links query -> each of the eight
      top8.forEach(function (p) {
        var ln = document.createElementNS(SVGNS, "line");
        ln.setAttribute("x1", QX);
        ln.setAttribute("y1", QY);
        ln.setAttribute("x2", p.x.toFixed(1));
        ln.setAttribute("y2", p.y.toFixed(1));
        ln.setAttribute("stroke", "#1e2bfa");
        ln.setAttribute("stroke-width", "2");
        ln.setAttribute("stroke-linecap", "round");
        var len = (p.d - 17).toFixed(1);
        ln.setAttribute("stroke-dasharray", len + " " + len);
        ln.setAttribute("stroke-dashoffset", len);
        svg.appendChild(ln);
        p.line = ln;
        p.len = len;
      });

      // ---------- Scene 1 (0.0-0.7): step 2 -> done, step 3 lights; eyebrow ----------
      tl.fromTo($("step2"), { opacity: 1 }, { opacity: 0.55, duration: 0.5, ease: "power2.out" }, 0.1);
      tl.fromTo($("step3-fill"), { scale: 0 }, { scale: 1, duration: 0.5, ease: "power3.out" }, 0.2);
      tl.fromTo($("step3-num"), { color: "#1e2bfa" }, { color: "#fdfae7", duration: 0.3, ease: "power2.out" }, 0.3);
      tl.fromTo($("step3-label"), { color: "#9a9a9a" }, { color: "#1e2bfa", duration: 0.4, ease: "power2.out" }, 0.3);
      tl.fromTo($("accent"), { opacity: 0, scaleX: 0 }, { opacity: 1, scaleX: 1, transformOrigin: "left center", duration: 0.4, ease: "power3.out" }, 0.15);
      tl.fromTo($("eyebrow"), { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.2);

      // ---------- Scene 2 (0.7-2.0): ask bar expands, question types, submit press ----------
      tl.fromTo($("ask"), { opacity: 0, scaleX: 0.25 }, { opacity: 1, scaleX: 1, duration: 0.5, ease: "power3.out" }, 0.3);

      var askText = $("ask-text");
      var placeholder = $("placeholder");
      var caret = $("caret");
      var QUESTION = "What did we decide about pricing?";
      var typed = { v: 0 };
      tl.fromTo(typed, { v: 0 }, {
        v: QUESTION.length,
        duration: 1.0,
        ease: "none",
        onUpdate: function () {
          var n = Math.floor(typed.v);
          askText.textContent = QUESTION.substring(0, n);
          placeholder.style.opacity = n > 0 ? "0" : "1";
        }
      }, 0.72);

      // caret blink: deterministic sin square wave, off after submit
      var blink = { p: 0 };
      tl.fromTo(blink, { p: 0 }, {
        p: Math.PI * 2 * 2.5,
        duration: 1.5,
        ease: "none",
        onUpdate: function () {
          caret.style.opacity = Math.sin(blink.p + Math.PI / 2) > 0 ? "1" : "0";
        }
      }, 0.35);
      tl.set(caret, { opacity: 0 }, 1.86);

      // submit press: linear dip, spring release, burst behind
      tl.to($("btn"), { scale: 0.88, duration: 0.12, ease: "power1.in" }, 1.76);
      tl.to($("btn"), { scale: 1, duration: 0.5, ease: "power3.out" }, 1.88);
      tl.fromTo($("burst"), { scale: 1, opacity: 0 }, { scale: 2.6, opacity: 0.8, duration: 0.4, ease: "power2.out" }, 1.88);
      tl.to($("burst"), { opacity: 0, duration: 0.45, ease: "power2.in" }, 2.28);
      tl.to($("ask"), { borderColor: "rgba(30,43,250,0.45)", duration: 0.3, ease: "power2.out" }, 1.88);

      // ---------- Scene 3 (2.0-3.1): dot field fills; permission filter dims a third ----------
      pts.forEach(function (p) {
        var delay = 2.0 + (p.x / W) * 0.35 + (p.idx % 3) * 0.03;

      });

      pts.forEach(function (p, i) {
        if (!p.blocked) return;
        tl.to(p.el, { opacity: 0.15, scale: 0.8, duration: 0.3, ease: "power2.out" }, 2.75 + (i % 7) * 0.03);
      });

      // ---------- Scene 4 (3.1-5.4): query point lands; eight nearest light up ----------
      tl.fromTo($("field"), { scale: 1 }, { scale: 1.04, duration: 2.3, ease: "sine.out" }, 3.1);
      tl.fromTo($("query"), { opacity: 0, scale: 2.2, y: -40 }, { opacity: 1, scale: 1, y: 0, duration: 0.4, ease: "power3.out" }, 3.12);
      tl.fromTo($("qring"), { scale: 1 }, { scale: 3.4, duration: 0.7, ease: "power2.out" }, 3.4);
      tl.fromTo($("qring"), { opacity: 0 }, { opacity: 0.7, duration: 0.05, ease: "none" }, 3.4);
      tl.to($("qring"), { opacity: 0, duration: 0.65, ease: "power2.out" }, 3.45);

        tl.fromTo(p.line, { attr: { "stroke-dashoffset": p.len } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.24, ease: "power2.out" }, t);
