          wrap.appendChild(ghost);
          var chars = [];
          Array.prototype.forEach.call(text, function (ch) {
            var s = document.createElement("span");
            s.className = FRAME + "-hchar";
            s.textContent = ch;
            s.dataset.target = ch;
            if (!dots) {
              s.style.opacity = "0";
              s.style.transform = "rotateX(90deg)";
            }
            wrap.appendChild(s);
            chars.push(s);
          });
          row.appendChild(wrap);
          parent.appendChild(row);
          return chars;
        }

        var colCenters = [706, 866, 1026, 1186];
        [0, 1, 2, 3].forEach(function (i) {
          var col = $("col-" + i);
          var head = document.createElement("div");
          head.className = FRAME + "-col-head";
          head.textContent = "0" + (i + 1);
          col.appendChild(head);

          var t0 = 3.5 + i * 0.25;
          var chunk = $("chunk-" + i);
          var dx = colCenters[i] - 310;
          var dy = 535 - (340 + 110 * i + 55);

          // ghost outline appears where the chunk was
          tl.fromTo($("ghost-" + i), { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, t0);
          // chunk travels to its slot and turns edge-on
          tl.to(chunk, { x: dx, y: dy, scale: 0.85, duration: 0.45, ease: "power2.inOut" }, t0);
          tl.fromTo(chunk, { rotationY: 0, transformPerspective: 1200 }, { rotationY: 90, duration: 0.25, ease: "power2.in" }, t0 + 0.2);
          tl.set(chunk, { autoAlpha: 0 }, t0 + 0.45);
          // column turns face-on in the same slot
          tl.fromTo(col, { autoAlpha: 0, rotationY: -90, transformPerspective: 1200 },
            { autoAlpha: 1, rotationY: 0, duration: 0.35, ease: "power2.out" }, t0 + 0.45);

          // per-character 3D flip-decode of the numbers
          VALUES[i].forEach(function (val, r) {
            var chars = buildRow(col, val, false);
            var rowStart = t0 + 0.6 + r * 0.12;
            chars.forEach(function (el, k) {
              var target = el.dataset.target;
              var isDigit = GLYPHS.indexOf(target) !== -1;
              var seedBase = i * 100000 + r * 1000 + k * 37;
              var state = { p: 0 };
              tl.fromTo(state, { p: 0 }, {
                p: 1,
                duration: FLIP_DURATION,
                ease: "power3.out",
                immediateRender: false,
                onUpdate: function () {
                  if (isDigit && state.p < REVEAL_THRESHOLD) {
                    el.textContent = pseudoGlyph(seedBase + Math.floor(state.p * 12));
                  } else {
                    el.textContent = target;
                  }
                  el.style.transform = "rotateX(" + (90 - state.p * 90) + "deg)";
                  el.style.opacity = String(Math.min(1, state.p * 2));
                }
              }, rowStart + k * CHAR_STAGGER);
            });
          });
          var dotsChars = buildRow(col, "…", true);
          tl.fromTo(dotsChars, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, t0 + 1.25);
        });

        tl.fromTo($("dims"), { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 4.2);
        tl.fromTo($("model"), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 5.1);

        // ---------- Scene 4 (6.1-9.2s): columns slide into Postgres + pgvector ----------
        tl.fromTo($("db"), { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.45, ease: "power2.out" }, 6.1);

        var paths = ["cyl-top", "cyl-left", "cyl-right", "cyl-bottom", "cyl-mid"].map($);
        paths.forEach(function (p) {
          var len = p.getTotalLength() * 1.02;
          p.style.strokeDasharray = String(len);
          p.style.strokeDashoffset = String(len);
        });
        tl.to(paths[0], { strokeDashoffset: 0, duration: 0.55, ease: "power2.out" }, 6.2);
        tl.to(paths[1], { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" }, 6.6);
        tl.to(paths[2], { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" }, 6.65);
        tl.to(paths[3], { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" }, 6.92);
        tl.to(paths[4], { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" }, 7.12);

        [0, 1, 2, 3].forEach(function (i) {
          var targetX = 1516 + 56 * i;
          tl.to($("col-" + i), { x: targetX - colCenters[i], scale: 0.32, duration: 0.65, ease: "power3.inOut" }, 6.7 + i * 0.12);
        });

        tl.fromTo($("db-title"), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 7.45);
        tl.fromTo($("db-sub"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: "power1.out" }, 7.7);

        // hold to the end of the frame
        tl.to({}, { duration: DUR }, 0);

        window.__timelines = window.__timelines || {};
        window.__timelines[FRAME] = tl;
      })();
    </script>
  </div>
</template>
