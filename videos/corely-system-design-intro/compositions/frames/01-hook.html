  <script>
    (function () {
      const FRAME_ID = "01-hook";
      const DURATION = 5.419;
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // ---- macro camera: slow push-in under the whole shot ----
      tl.fromTo(
        "#h01-stage",
        { scale: 1 },
        { scale: 1.035, duration: DURATION, ease: "none" },
        0
      );

      // ---- Scene 1 (0.0-2.0s): question builds word by word ----
      // dynamic-content-sequencing: per-word windows pre-computed once from content length.
      const BASE = 0.12;
      const SEC_PER_CHAR = 0.03;
      const START = 0.05;
      const words = gsap.utils.toArray("#h01-q .h01-word");
      let cumulative = START;
      const WORD_TIMELINE = words.map((el) => {
        const start = cumulative;
        cumulative += BASE + el.textContent.length * SEC_PER_CHAR;
        return { el, start };
      });
      WORD_TIMELINE.forEach(({ el, start }) => {
        tl.fromTo(
          el,
          { opacity: 0, y: 26, filter: "blur(8px)" },
          { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.38, ease: "power3.out" },
          start
        );
      });

      // ---- Scene 2 (2.0-3.1s): question rises + shrinks to h2; sub line fades up ----
      // h2 / h1 = 2.6 / 4.2 = 0.619
      tl.fromTo(
        "#h01-q-wrap",
        { y: 0, scale: 1 },
        { y: -190, scale: 0.619, duration: 0.8, ease: "power3.inOut" },
        2.0
      );
      tl.fromTo(
        "#h01-sub",
        { opacity: 0, y: 18 },
        { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" },
        2.4
      );

      // ---- Scene 3 (3.1-5.4s): three tilted cards spring-pop on each spoken name ----
      const CARDS = [
        { sel: "#h01-card-slack", at: 3.3, rot: -5, depth: 1.0, drift: -10 },
        { sel: "#h01-card-notion", at: 3.9, rot: 4, depth: 0.92, drift: -6 },
        { sel: "#h01-card-email", at: 4.6, rot: -2, depth: 1.04, drift: -14 },
      ];
      CARDS.forEach((c) => {
        tl.fromTo(
          c.sel,
          { scale: 0, opacity: 0, y: 24, rotation: c.rot * 2 },
          {
            scale: c.depth,
            opacity: c.depth < 1 ? 0.88 : 1,
            y: 0,
            rotation: c.rot,
            duration: 0.55,
            ease: "power3.out",
          },
          c.at
        );
        // quiet parallax drift after landing (finite, not a loop)
        const driftStart = c.at + 0.55;
        tl.fromTo(
          c.sel,
          { yPercent: 0 },
          { yPercent: c.drift / 10, duration: Math.max(0.1, DURATION - driftStart), ease: "sine.out" },
          driftStart
        );
      });

      // pad the timeline to the full frame length
      tl.set({}, {}, DURATION);

      window.__timelines[FRAME_ID] = tl;
    })();
  </script>
