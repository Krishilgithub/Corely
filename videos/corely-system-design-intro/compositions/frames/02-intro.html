    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        const FID = "02-intro";
        const DUR = 5.973;
        const byId = (s) => document.getElementById(FID + "-" + s);
        const byClass = (s) => Array.prototype.slice.call(document.getElementsByClassName(FID + "-" + s));

        const world = byId("world");
        const rings = byId("rings");
        const glow = byId("glow");
        const chips = byClass("chip");
        const lines = byClass("line");
        const outline = byId("hub-outline");
        const hub = byId("hub");
        const hubWord = byId("hub-word");
        const ask = byId("ask");
        const askText = byId("ask-text");
        const caret = byId("caret");
        const card = byId("card");
        const cardEyebrow = byId("card-eyebrow");
        const cardLine = byId("card-line");
        const cites = byClass("cite");

        const tl = gsap.timeline({ paused: true });

        // ---- Scene 1 (0.0-2.0s): chips burst from the center to an even ring ----
        tl.fromTo(rings, { opacity: 0, scale: 0.92, transformOrigin: "960px 410px" },
          { opacity: 1, scale: 1, duration: 1.2, ease: "power2.out" }, 0);
        tl.fromTo(outline, { opacity: 0, scale: 0.7 },
          { opacity: 1, scale: 1, duration: 0.6, ease: "power3.out" }, 0.05);

        const ENTRY_AT = 0.12;
        const STAGGER = 0.07;
        const START_PROGRESS = 0.15;
        chips.forEach((el, i) => {
          const tx = Number(el.dataset.targetX);
          const ty = Number(el.dataset.targetY);
          tl.fromTo(
            el,
            { xPercent: -50, yPercent: -50, x: tx * START_PROGRESS, y: ty * START_PROGRESS, scale: 0.6, opacity: 0 },
            { x: tx, y: ty, scale: 1, opacity: 1, duration: 1.2, ease: "power3.out" },
            ENTRY_AT + i * STAGGER
          );
        });

        // connector lines draw from each chip toward the center
        lines.forEach((el, i) => {
          const len = el.getTotalLength();
          tl.fromTo(el, { strokeDasharray: len, strokeDashoffset: len },
            { strokeDashoffset: 0, duration: 0.8, ease: "power2.inOut" }, 0.75 + i * STAGGER);
        });

        // ---- Scene 2 (2.0-2.9s): "one memory" - hub fills cobalt, spring-pop ----
        tl.fromTo(glow, { opacity: 0, scale: 0.6 },
          { opacity: 1, scale: 1, duration: 0.8, ease: "power2.out" }, 2.0);
        tl.fromTo(hub, { scale: 0, opacity: 1 },
          { scale: 1, duration: 0.6, ease: "power3.out" }, 2.0);
        tl.fromTo(hubWord, { opacity: 0, y: 14 },
          { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 2.18);
        // lines brighten once the hub lands (everything now feeds one place)
        tl.fromTo(lines, { strokeOpacity: 0.45 },
          { strokeOpacity: 1, duration: 0.4, ease: "power2.out" }, 2.25);

        // ---- Scene 3 (2.9-4.3s): camera pushes in to the hub, ring softens (DOF) ----
        tl.fromTo(world, { scale: 1, y: 0 },
          { scale: 1.28, y: -110, duration: 1.4, ease: "power2.inOut" }, 2.9);
        tl.fromTo(chips, { filter: "blur(0px)", opacity: 1 },
          { filter: "blur(5px)", opacity: 0.32, duration: 1.0, ease: "power2.out", immediateRender: false }, 2.95);
        tl.fromTo(lines, { opacity: 1 },
          { opacity: 0.35, duration: 1.0, ease: "power2.out" }, 2.95);
        tl.fromTo(rings, { filter: "blur(0px)" },
          { filter: "blur(2px)", duration: 1.0, ease: "power2.out" }, 2.95);

        // ask bar pops in under the hub
        tl.fromTo(ask, { opacity: 0, y: 26, scale: 0.96 },
          { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "power3.out" }, 2.95);

        // type-on (smooth slice variant: plain typing, no edits)
        const QUESTION = "What did we decide about pricing?";
        const len = { v: 0 };
        tl.fromTo(len, { v: 0 }, {
          v: QUESTION.length,
          duration: 1.15,
          ease: "power1.inOut",
          onUpdate: () => { askText.textContent = QUESTION.substring(0, Math.floor(len.v)); },
        }, 3.15);
        tl.call(() => { askText.textContent = ""; }, null, 0);

        // caret blink: deterministic sin square wave on the timeline
        const blink = { p: 0 };
        const BLINK_START = 2.95;
        const BLINK_DUR = DUR - BLINK_START;
        tl.fromTo(blink, { p: 0 }, {
          p: Math.PI * 2 * (BLINK_DUR / 0.6),
          duration: BLINK_DUR,
          ease: "none",
          onUpdate: () => {
            const typing = len.v > 0 && len.v < QUESTION.length;
            caret.style.opacity = typing || Math.sin(blink.p) > 0 ? "1" : "0";
          },
        }, BLINK_START);

        // ---- Scene 4 (4.3-6.0s): "with sources" - cited answer card slides up ----
        tl.fromTo(card, { opacity: 0, y: 48 },
          { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 4.3);
        tl.fromTo(cardEyebrow, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 4.42);
        tl.fromTo(cardLine, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 4.48);
        cites.forEach((el, i) => {
          tl.fromTo(el, { opacity: 0, scale: 0.6 },
            { opacity: 1, scale: 1, duration: 0.45, ease: "power3.out" }, 4.75 + i * 0.15);
        });

        // held read: slow camera drift underneath so the hold breathes
        tl.fromTo(world, { scale: 1.28 }, { scale: 1.31, duration: DUR - 4.3, ease: "none", immediateRender: false }, 4.3);

        window.__timelines = window.__timelines || {};
        window.__timelines[FID] = tl;
      })();
    </script>
