      // ---- Scene 1 (0.0-1.2s): rail draws in, step 01 pops cobalt, eyebrow ----

      ["#c03-step1", "#c03-step2", "#c03-step3", "#c03-step4", "#c03-step5"].forEach((id, i) => {
        tl.fromTo(q(id), { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.35, ease: "power3.out" }, 0.08 + i * 0.1);
      });
      ["#c03-label1", "#c03-label2", "#c03-label3", "#c03-label4", "#c03-label5"].forEach((id, i) => {
        tl.fromTo(q(id), { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.35, ease: "power1.out" }, 0.25 + i * 0.08);
      });

      tl.fromTo(q("#c03-accent"), { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power2.out" }, 0.75);
      tl.fromTo(q("#c03-eyebrow"), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 0.8);

      // ---- Scene 2 (1.2-2.8s): six source chips stack in, OAuth line draws ----

        tl.fromTo(q("#c03-chip" + i), { opacity: 0, x: -36 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 1.2 + i * 0.12);
        tl.to(q("#c03-feed" + i), { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" }, 1.5 + i * 0.08);
      }

      tl.fromTo(q("#c03-oauth"), { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.35, ease: "power3.out" }, 2.3);
