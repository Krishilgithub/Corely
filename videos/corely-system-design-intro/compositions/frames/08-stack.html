        // ---------- path-draw setup (measured lengths) ----------
        const prep = (id) => {
          const p = $(id);
          const len = p.getTotalLength() * 1.02;
          p.style.strokeDasharray = len + " " + len;
          p.style.strokeDashoffset = String(len);
          return p;
        };
        const linkPg = prep("08-stack-link-pg");
        const linkOa = prep("08-stack-link-oa");
        const linkRedis = prep("08-stack-link-redis");
        const dockerReveal = prep("08-stack-docker-reveal");

          { opacity: 1, y: 0, duration: 0.45, ease: "power2.out", stagger: 0.12 }, 0.3);
        tl.fromTo($("08-stack-app-head"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 0.75);
        tl.fromTo($("08-stack-eyebrow"), { opacity: 0, x: -12 }, { opacity: 1, x: 0, duration: 0.45, ease: "power2.out" }, 1.05);

        // Scene 2: "one Postgres database" -> link draws, DB card lands; OpenAI + Redis beside it.

        tl.to(linkPg, { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" }, 1.52);
        tl.fromTo($("08-stack-dot-pg-b"), { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "power1.out" }, 1.82);
